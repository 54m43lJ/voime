[package]
name = "voime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "纯本地语音输入法：FireRedVAD + FireRedASR2-AED + FireRedPunc"
default-run = "voime"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15.3"
crossbeam-channel = "0.5"
crossterm = "0.28.1"
kaldi-native-fbank = "0.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "api-24",
] }
ratatui = "0.29"
rubato = "0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
