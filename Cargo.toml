[workspace]
members = [
    "crates/voime-core",
    "crates/voime-ipc",
    "crates/voimed",
    "crates/voime",
]
default-members = [
    ".",
    "crates/voime-core",
    "crates/voime-ipc",
    "crates/voimed",
    "crates/voime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
cpal = "0.15.3"
crossterm = "0.28.1"
kaldi-native-fbank = "0.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "api-24",
] }
ratatui = "0.29"
rubato = "0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
unicode-width = "0.2"

[package]
name = "voime-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

autotests = false
autobins = false
autoexamples = false
autobenches = false

[[test]]
name = "segmenter"
path = "tests/segmenter.rs"

[[test]]
name = "ipc"
path = "tests/ipc.rs"

[[test]]
name = "state"
path = "tests/state.rs"

[[test]]
name = "daemon"
path = "tests/daemon.rs"

[[test]]
name = "asr_ctc"
path = "tests/asr_ctc.rs"

[dev-dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
tempfile.workspace = true
voime-core = { path = "crates/voime-core" }
voime-ipc = { path = "crates/voime-ipc" }
voimed = { path = "crates/voimed" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
