[workspace]
resolver = "2"
members = ["voime_core", "voime_cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "api-24",
] }
ndarray = "0.17"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
kaldi-native-fbank = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
