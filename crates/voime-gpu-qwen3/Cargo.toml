[workspace]

[package]
name = "voime-gpu-qwen3"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Voime Qwen3-ASR GPU Final worker"
publish = false

[[bin]]
name = "voime-gpu-qwen3"
path = "src/main.rs"

[features]
default = []
vulkan = ["llama-cpp-4/vulkan"]
cuda = ["llama-cpp-4/cuda"]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
llama-cpp-4 = { version = "=0.11.0", default-features = false, features = ["mtmd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
voime-gpu-common = { path = "../voime-gpu-common" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
