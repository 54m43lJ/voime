[workspace]

[package]
name = "voime-gpu-firered"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Voime FireRed GPU Final worker"
publish = false

[[bin]]
name = "voime-gpu-firered"
path = "src/main.rs"

[features]
default = []
cuda = ["ort/cuda"]
migraphx = ["ort/migraphx"]
directml = ["ort/directml"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
kaldi-native-fbank = "0.1"
ort = { version = "=2.0.0-rc.14", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "api-29",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
voime-gpu-common = { path = "../voime-gpu-common" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
