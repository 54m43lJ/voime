[workspace]

[package]
name = "voime-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Voime Windows 托盘前端"
publish = false

[[bin]]
name = "voime-tray"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.32.3", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voime-ipc = { path = "../../crates/voime-ipc" }
voime-transport = { path = "../../crates/voime-transport" }
winit = "0.30"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
